# IXMetrics Netlify configuration
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/scout-report"
  to = "/.netlify/functions/scout-report"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/.netlify/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
