<!doctype html>
<html lang="en">
  <body style="margin:0;background:#07101f;color:#dffcff;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:40px 20px;">
      <div style="border:1px solid #263b55;border-radius:18px;background:#101a2d;padding:30px;">
        <div style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#65f2b5;text-transform:uppercase;">IXMetrics</div>
        <h1 style="margin:14px 0 10px;font-size:28px;line-height:1.2;color:#ffffff;">Welcome to IXMetrics</h1>
        <p style="margin:0 0 20px;color:#b8c5d5;line-height:1.65;">Thanks for creating your account. Confirm your email address to finish setting up your IXMetrics account.</p>
        <p style="margin:26px 0;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:10px;background:#00e6f4;color:#062a31;text-decoration:none;font-weight:800;padding:13px 20px;">CONFIRM EMAIL</a>
        </p>
        <p style="margin:0;color:#8495aa;font-size:12px;line-height:1.6;">If you did not create an IXMetrics account, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
