<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ScoutCore Baseball Radar Logo</title>
  <desc id="desc">A baseball with cyan radar arcs representing scouting and analytics.</desc>
  <defs>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e5ea"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7f2"/>
      <stop offset="1" stop-color="#05b8d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- radar arcs -->
  <g fill="none" stroke="url(#cyan)" stroke-linecap="round" filter="url(#glow)">
    <path d="M57 28 A43 43 0 0 1 100 71" stroke-width="6"/>
    <path d="M66 14 A57 57 0 0 1 114 62" stroke-width="6"/>
    <path d="M51 40 A30 30 0 0 1 88 77" stroke-width="5" opacity=".9"/>
  </g>

  <!-- ball -->
  <circle cx="48" cy="76" r="33" fill="url(#ball)"/>
  <circle cx="48" cy="76" r="33" fill="none" stroke="#0b1326" stroke-width="2.5" opacity=".9"/>

  <!-- seams -->
  <path d="M27 51 C39 61 41 89 29 101" fill="none" stroke="#101827" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M69 51 C57 61 55 89 67 101" fill="none" stroke="#101827" stroke-width="3.8" stroke-linecap="round"/>
  <g stroke="#101827" stroke-width="2.2" stroke-linecap="round">
    <path d="M31 58 l-7 2"/><path d="M34 65 l-7 1"/><path d="M35 73 l-7 0"/><path d="M35 81 l-7 -1"/><path d="M33 89 l-7 -2"/><path d="M30 96 l-6 -3"/>
    <path d="M65 58 l7 2"/><path d="M62 65 l7 1"/><path d="M61 73 l7 0"/><path d="M61 81 l7 -1"/><path d="M63 89 l7 -2"/><path d="M66 96 l6 -3"/>
  </g>

  <!-- subtle lower radar ring -->
  <path d="M20 103 A43 43 0 0 0 82 111" fill="none" stroke="#27c9df" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>