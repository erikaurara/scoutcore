name: IXMetrics Live Intelligence

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IXMetrics
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate TypeScript
        run: npm run lint

      - name: Start IXMetrics analytics server
        env:
          NODE_ENV: production
        run: |
          npm run dev > /tmp/scoutcore.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/games/today >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/games/today >/dev/null

      - name: Generate IXMetrics intelligence
        env:
          SCOUTCORE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/generate-daily-intelligence.mjs

      - name: Publish IXMetrics intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily-intelligence.json
          if git diff --cached --quiet; then
            echo "No intelligence changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh IXMetrics live intelligence"
          git push
